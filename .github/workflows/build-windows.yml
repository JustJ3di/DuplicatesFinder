name: Build Windows executable

on:
  push:
    branches:
      - realase-branch
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name duplicates-finder main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: duplicates-finder-windows-x86_64
          path: dist/duplicates-finder.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: duplicates-finder-windows-x86_64
          path: release-assets

      - name: Create release and upload executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/duplicates-finder.exe \
            --repo "$GH_REPO" \
            --title "DuplicatesFinder $RELEASE_TAG" \
            --generate-notes