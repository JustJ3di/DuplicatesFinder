name: Build Windows executable

on:
  push:
    branches:
      - realase-branch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name duplicates-finder main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: duplicates-finder-windows-x86_64
          path: dist/duplicates-finder.exe
          if-no-files-found: error
          retention-days: 14